name: Publish approved BPMS build to GitHub Pages

on:
  workflow_dispatch:
    inputs:
      materials_approved:
        description: "Confirm rights and privacy review for all public materials"
        required: true
        type: boolean
        default: false
      source_sha:
        description: "Reviewed commit SHA on main, or leave empty to use this run's main SHA"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main' && inputs.materials_approved
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - name: Verify reviewed source
        env:
          SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
        run: |
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          git merge-base --is-ancestor "$SOURCE_SHA" origin/main
          git checkout --detach "$SOURCE_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check:release
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
