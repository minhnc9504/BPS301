<head><meta charset="utf-8"><title>BPMS - Business Process Management System · Đang mở trang</title></head>
<body>
  <p><a href="/BPS301/">Về trang chủ BPMS</a></p>
  <script>
    const base = '/BPS301/';
    if (location.pathname.startsWith(base) && location.pathname !== base) {
      const route = location.pathname.slice(base.length) + location.search + location.hash;
      location.replace(base + '?__spa=' + encodeURIComponent(route));
    }
  </script>
</body>
