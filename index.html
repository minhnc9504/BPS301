<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#182351" />
    <link rel="icon" type="image/jpeg" href="%BASE_URL%img/logo.jpg" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" />
    <title>BPMS - Business Process Management System</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      const base = '%BASE_URL%';
      const route = new URLSearchParams(location.search).get('__spa');
      if (route && location.pathname === base && /^[\w-][^\\]*$/.test(route)) {
        const target = new URL(base + route, location.origin);
        if (target.pathname.startsWith(base)) history.replaceState(null, '', target);
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
